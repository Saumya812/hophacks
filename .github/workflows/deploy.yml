name: Deploy FindMyPal

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: findmypal-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Validate Python imports
        working-directory: backend
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m compileall -q .

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.FINDMYPAL_SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.FINDMYPAL_SERVER_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/findmypal_deploy
          chmod 600 ~/.ssh/findmypal_deploy
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Deploy on VPS
        env:
          SERVER_HOST: ${{ secrets.FINDMYPAL_SERVER_HOST }}
          SERVER_USER: ${{ secrets.FINDMYPAL_SERVER_USER }}
          SERVER_PORT: ${{ secrets.FINDMYPAL_SERVER_PORT }}
        run: |
          ssh -i ~/.ssh/findmypal_deploy -p "${SERVER_PORT:-22}" "${SERVER_USER}@${SERVER_HOST}" \
            '/opt/findmypal/deploy.sh'
